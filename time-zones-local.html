<!doctype html><html lang="en"><head><meta charset="utf-8"><title>North American Time Zones</title>
<style>
:root{--bg:#f2f0eb;--fg:#1d2430;--mu:#5b6573;--cd:#fff;--ln:#d6d2c8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151c;--fg:#e8edf2;--mu:#98a3b0;--cd:#171e28;--ln:#2a3340}}
:root[data-theme=dark]{--bg:#10151c;--fg:#e8edf2;--mu:#98a3b0;--cd:#171e28;--ln:#2a3340}
body{margin:0;background:var(--bg);color:var(--fg);font:16.8px/1.45 system-ui,sans-serif}
main{width:1240px;margin:0 auto;padding:28px 0 60px}
h1{font:600 40.8px Georgia,serif;margin:0 0 4px}h2{font:600 26.4px Georgia,serif;margin:36px 0 12px}
p.s{color:var(--mu);margin:0 0 16px}
#map{background:#0e1621;border-radius:6px;width:100%;display:block}
#map text{font:600 14.4px system-ui;fill:#f1f4f7;paint-order:stroke;stroke:#0e1621;stroke-width:3.6px;pointer-events:none}
#msg{color:#c0504d;margin:8px 0}
#leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0;color:var(--mu)}
#leg i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.c{background:var(--cd);border:1px solid var(--ln);border-top:5px solid;border-radius:6px;padding:12px 14px}
.c b{font:600 20.4px Georgia,serif;display:block}.c .t{font:600 48px Georgia,serif;letter-spacing:.02em}
.c small{display:block;color:var(--mu)}.c .v{margin-top:8px;border-top:1px solid var(--ln);padding-top:6px;font-size:14.4px}
.tag{display:inline-block;border:1px solid var(--ln);border-radius:10px;padding:0 8px;font-size:14.4px;margin-top:4px}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head><body><main>
<h1>North American time zones</h1>
<p class="s">24-hour clock for every Canadian province and territory and every US state. Refreshes once a minute.</p>
<svg id="map" role="img" aria-label="Map of Canada and the United States coloured by time zone"></svg>
<div id="msg"></div><div id="leg"></div>
<h2>Canada</h2><div class="g" id="ca"></div>
<h2>United States</h2><div class="g" id="us"></div>
</main>
<script>

'Nebraska, western panhandle':['USA:NE',R(-104.1,-101.6,40,43)],
'North Dakota, southwest':['USA:ND',R(-104.1,-102.3,45.9,48.1),R(-102.3,-101,45.9,46.9)],
'Malheur County (Oregon)':['USA:OR',R(-118.4,-116.9,42,44)],'South Dakota, west of Missouri River':['USA:SD',R(-104.1,-100.65,43,45.95)],

'Texas, El Paso and Hudspeth':['USA:TX',R(-106.7,-104.8,30.65,32)],'Idaho, northern panhandle':['USA:ID',R(-117.3,-114.7,45.5,49)]};
const mk=r=>({n:r[0],l:r[1],g:r[2],m:r[3],a:r[4],b:r[5]});
const J=[...CA.map(r=>({...mk(r),k:r[0],code:r[6],r:'ca'})),...UC.map(r=>({n:r[0],l:r[1],g:r[2],m:'i',a:r[3],b:r[4],k:r[2],r:'us',st:US[r[2]]||''}))];
const $=(t,a={},h='')=>{const e=document.createElement(t);for(const k in a)e.setAttribute(k,a[k]);e.innerHTML=h;return e};

// cards (variances appear inside their parent card)
const byKey={};
J.forEach(j=>{const c=$('div',{class:'c',style:'border-top-color:'+G[j.g][0]},`<b>${j.n}</b>`);j.tm=$('div',{class:'t'});j.sub=$('small');j.tg=$('span',{class:'tag'});c.append(j.tm,j.sub,j.tg);if(j.st)c.append($('small',{style:'margin-top:6px;font-size:14.4px'},j.st));byKey[j.r+j.k]=c;document.getElementById(j.r).appendChild(c)});
const VJ=V.map(r=>({n:r[1],l:'',g:r[2],m:r[3],a:r[4],b:r[5],note:r[6],pk:r[0]}));
VJ.forEach(v=>{const c=byKey['ca'+v.pk]||byKey['us'+v.pk];let box=c.querySelector('.v');if(!box){box=$('div',{class:'v'});c.append(box)}v.el=$('div',{});box.append(v.el)});
const leg=document.getElementById('leg');for(const g in G)leg.appendChild($('span',{},`<i style="background:${G[g][0]}${G[g][1]?';background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.3) 0 2px,transparent 2px 4px)':''}"></i>${G[g][2]}`));
leg.appendChild($('span',{},'Hatched: clocks never change. Heavy line: international border; mid line: province/state border.'));
// map
const W=960,H=620,svg=d3.select('#map').attr('viewBox',`0 0 ${W} ${H}`),labs=[];
const proj=d3.geoAlbers().rotate([96,0]).center([0,60]).parallels([45,70]).fitExtent([[10,10],[W-10,H-10]],{type:'MultiPoint',coordinates:[[-168,54],[-52,47],[-125,25],[-82,25],[-100,80]]});

 const df=svg.append('defs'),pt=df.append('pattern').attr('id','h').attr('width',6).attr('height',6).attr('patternUnits','userSpaceOnUse').attr('patternTransform','rotate(45)');pt.append('rect').attr('width',6).attr('height',3).attr('fill','rgba(0,0,0,.28)');

 const gm=svg.append('g');
 gm.selectAll('path').data(main).join('path').attr('d',path).attr('fill',f=>{const g=grp(f);return g?G[g][0]:'#232b36'}).attr('stroke','rgba(255,255,255,.4)').attr('stroke-width',.6).append('title').text(f=>f.properties.name);

 const LK=lk.features.filter(f=>/Superior|Michigan|Huron|Erie|Ontario|St\. Clair|Georgian/.test(f.properties.name||''));
 svg.append('g').selectAll('path').data(LK).join('path').attr('d',path).attr('fill','#16314a').attr('stroke','rgba(255,255,255,.35)').attr('stroke-width',.5);
 // time-zone dividers where a zone changes inside a province/state
 const pp=r=>'M'+r.map(c=>proj(c).map(n=>n.toFixed(1)).join(',')).join('L')+'Z';
 VJ.forEach((v,i)=>{const m=VM[v.n];if(!m)return;const[cc,pc]=m[0].split(':'),pf=fs.find(f=>f.properties.adm0_a3==cc&&f.properties.postal==pc);if(!pf)return;
  df.append('clipPath').attr('id','cp'+i).append('path').attr('d',path(pf));
  const g=svg.append('g').attr('clip-path','url(#cp'+i+')'),d=m.slice(1).map(pp).join('');

 svg.append('path').datum(topojson.mesh(w,w.objects.countries,(x,y)=>x!==y)).attr('d',path).attr('fill','none').attr('stroke','#e6ebf0').attr('stroke-width',1.8).attr('stroke-linejoin','round');
 // international border through the Great Lakes

 main.forEach(f=>{const g=grp(f);if(!g)return;const c=f.properties.adm0_a3=='CAN',k=g+(c?'c':'u')+(c&&f.properties.postal=='NU'?'n':'');(gf[k]=gf[k]||{g,c,nu:k.endsWith('n'),fl:[]}).fl.push(f)});
 for(const k in gf){const{g,c,nu,fl}=gf[k];let sx=0,sy=0,sa=0;fl.forEach(f=>{const a=path.area(f),q=path.centroid(f);sx+=q[0]*a;sy+=q[1]*a;sa+=a});let p=[sx/sa,sy/sa];
  if(!fl.some(f=>d3.geoContains(f,proj.invert(p))))p=path.centroid(fl.reduce((m,f)=>path.area(f)>path.area(m)?f:m));
  if(g=='nl')p=proj([-56.2,48.7]); // put NLT over the island of Newfoundland, not Labrador
  const j=nu?J.find(x=>x.code=='NU'):J.find(x=>x.g==g&&x.r==(c?'ca':'us')),t=svg.append('text').attr('x',p[0]).attr('y',p[1]).attr('text-anchor','middle');
